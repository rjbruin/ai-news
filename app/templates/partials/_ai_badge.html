{% macro ai_badge(size='md', label=true, extra_class='') %}
<a href="{{ url_for('web.ai_disclosure') }}" class="ai-badge ai-badge--{{ size }} {{ extra_class }}"
   title="This content is AI-generated — click to learn more">
  <span class="ai-badge__mark" aria-hidden="true">
    <span class="ai-badge__text">AI</span>
  </span>
  {% if label %}<span class="ai-badge__label">AI-generated</span>{% endif %}
</a>
{% endmacro %}
